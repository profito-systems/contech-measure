name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tested commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Run site checks
        run: |
          node --version
          npm --version
          npm run check
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Verify desktop and mobile measurement flows
        run: npm run test:browser
