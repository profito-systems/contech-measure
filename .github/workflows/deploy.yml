name: Legacy Contech Pages deploy (disabled)

# Public Miarka is served from MattMurz/mattmurz.github.io/miarka/.
# Keep this workflow as historical documentation, not a second publishing route.
# Do not restore the gh-pages force-push without an approved release plan.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-deploy-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain canonical publishing route
        run: |
          echo "Legacy Contech gh-pages deployment is intentionally disabled."
          echo "Canonical live Miarka: https://mattmurz.github.io/miarka/"
          echo "Use a reviewed release to the canonical website instead."
